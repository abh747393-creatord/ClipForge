<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge — phone remote</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  h1 { font-size:20px; margin:4px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  input, button { font: inherit; }
  input[type=text], input[type=url], input[type=number] { width:100%; background:#0d1117; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; }
  button { background:#21262d; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  button:disabled { opacity:.45; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .hint { color:var(--muted); font-size:13px; margin-top:6px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .badge.live, .badge.recording { background:var(--ok); color:#04120a; border-color:var(--ok); }
  .badge.error { background:var(--bad); color:#fff; border-color:var(--bad); }
  .hype { height:10px; background:#0d1117; border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-top:6px; }
  .hype-fill { height:100%; background:linear-gradient(90deg,#3fb950,#d29922,#f85149); width:0; transition:width .4s; }
  .job { padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .job:last-child { border-bottom:none; }
  .job .sub { color:var(--muted); font-size:12px; }
  #toast { position:fixed; left:16px; right:16px; bottom:16px; background:#21262d; border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:none; }
</style>
</head>
<body>
<h1>✂️ ClipForge remote</h1>

<div class="card" id="loginCard" hidden>
  <h2>Enter PIN</h2>
  <input id="pin" type="text" inputmode="numeric" autocomplete="off" placeholder="PIN">
  <div class="row"><button class="primary" id="loginBtn">Unlock</button></div>
  <div class="hint">Set the PIN in Settings → Alerts &amp; phone remote on the computer.</div>
</div>

<div id="app" hidden>
  <div class="card">
    <h2>Live clipping</h2>
    <div id="liveNone">
      <input id="liveUrl" type="url" placeholder="Live stream link (YouTube / Twitch / Kick)">
      <div class="row"><button class="primary" id="liveStart">● Start live</button></div>
    </div>
    <div id="liveOn" hidden>
      <div><span class="badge" id="liveStatus">starting</span> <span class="hint" id="liveElapsed"></span></div>
      <div class="hint" id="liveTitle"></div>
      <div class="hype"><div class="hype-fill" id="hypeFill"></div></div>
      <div class="row">
        <input id="clipSec" type="number" min="10" max="180" step="5" value="30" style="width:90px">
        <button id="clipNow">✂ Clip now</button>
        <button class="danger" id="liveStop">Stop</button>
      </div>
      <div class="hint" id="liveClips"></div>
    </div>
  </div>

  <div class="card">
    <h2>Jobs</h2>
    <div id="jobs"></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let liveId = null, timer = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => { t.style.display = "none"; }, 3500); }
async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || ("failed (" + res.status + ")"));
  return data;
}
function postJSON(path, body) { return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec || 0)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

async function boot() {
  try {
    const s = await api("/api/phone/status");
    if (s.pin_required && !s.ok) { $("loginCard").hidden = false; return; }
    showApp();
  } catch (e) { toast(e.message); }
}
function showApp() {
  $("loginCard").hidden = true;
  $("app").hidden = false;
  refresh();
  timer = setInterval(refresh, 3000);
}
async function refresh() {
  try {
    const jobs = await api("/api/jobs");
    $("jobs").innerHTML = (jobs || []).slice(0, 8).map((j) =>
      '<div class="job">' + esc(j.title || j.id) + '<div class="sub">' + esc(j.status || "") + " · " + esc(j.stage || "") + " · " + (j.clips_done || 0) + " clips</div></div>"
    ).join("") || '<div class="hint">No jobs yet.</div>';
  } catch (e) { /* keep polling */ }
  try {
    const list = await api("/api/live");
    const s = (list || []).find((x) => x.status === "recording" || x.status === "starting") || (liveId ? (list || []).find((x) => x.id === liveId) : null);
    renderLive(s);
  } catch (e) { /* keep polling */ }
}
function renderLive(s) {
  if (!s) { $("liveOn").hidden = true; $("liveNone").hidden = false; return; }
  liveId = s.id;
  $("liveOn").hidden = false;
  $("liveNone").hidden = true;
  const st = $("liveStatus"); st.textContent = s.status; st.className = "badge " + s.status;
  $("liveElapsed").textContent = fmtTime(s.elapsed);
  $("liveTitle").textContent = s.title || s.url || "";
  $("hypeFill").style.width = Math.max(0, Math.min(100, s.hype || 0)) + "%";
  const done = (s.clips || []).filter((c) => c.status === "done").length;
  $("liveClips").textContent = done + " clip(s) ready" + (s.error ? " · " + s.error : "");
}
$("loginBtn").addEventListener("click", async () => {
  try { await postJSON("/api/phone/login", { pin: $("pin").value.trim() }); showApp(); }
  catch (e) { toast(e.message); }
});
$("liveStart").addEventListener("click", async () => {
  const url = $("liveUrl").value.trim();
  if (!url) { toast("Paste a live link first."); return; }
  try { const s = await postJSON("/api/live/start", { url: url, options: {} }); liveId = s.id; renderLive(s); }
  catch (e) { toast(e.message); }
});
$("clipNow").addEventListener("click", async () => {
  if (!liveId) return;
  try { renderLive(await postJSON("/api/live/" + liveId + "/clip-now", { seconds: parseInt($("clipSec").value, 10) || 30 })); toast("Clipping…"); }
  catch (e) { toast(e.message); }
});
$("liveStop").addEventListener("click", async () => {
  if (!liveId) return;
  try { renderLive(await postJSON("/api/live/" + liveId + "/stop", {})); }
  catch (e) { toast(e.message); }
});
boot();
</script>
</body>
</html>
